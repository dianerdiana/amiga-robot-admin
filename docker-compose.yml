# AMIGA Robot Admin - Docker Compose
#
# Lives at the repo root so every service can reference its own folder
# (./backend, ./frontend) without this file ever needing to move.
#
# Usage:
#   cp .env.example .env
#   docker compose up -d db
#
# Variables come from the root .env file (see .env.example).

name: amiga-robot-admin

services:
  db:
    image: postgres:18-alpine
    container_name: amiga-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-amiga_robot_admin}
    ports:
      # Bound to localhost only; host port is configurable in case 5432 is taken.
      - "127.0.0.1:${DB_HOST_PORT:-5432}:5432"
    volumes:
      # postgres 18+ keeps data under /var/lib/postgresql/<major>/docker,
      # so the volume is mounted one level up.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - amiga

  # --- Planned services (uncomment once their Dockerfiles exist) ---------
