# AMIGA Robot Admin - Docker Compose (production stack; used as-is on EC2)
#
#   Browser -> :WEB_PORT caddy -> /api, /auth, /docs, /health -> backend:8000 -> db:5432
#                              -> everything else             -> frontend:3000
#
# Usage:
#   cp .env.example .env && cp backend/.env.example backend/.env   # then fill both in
#   docker compose up -d --build
# Local hot reload: docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
# Full runbook: docs/DEPLOYMENT.md
#
# STRICT CONFIG: every variable is required (${VAR:?...}); there are no defaults, so an
# incomplete .env stops `docker compose` before anything starts.

name: amiga-robot-admin

services:
  db:
    image: postgres:18-alpine
    container_name: amiga-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:?DB_USER is required in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required in .env}
      POSTGRES_DB: ${DB_NAME:?DB_NAME is required in .env}
    # No published port: only the backend reaches the DB over the internal network.
    # (docker-compose.dev.yml publishes it on 127.0.0.1 for local tools.)
    volumes:
      # postgres 18+ keeps data under /var/lib/postgresql/<major>/docker,
      # so the volume is mounted one level up.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 256m
    networks:
      - amiga

  backend:
    build: ./backend
    image: amiga-robot-admin-backend
    container_name: amiga-backend
    restart: unless-stopped
    # App settings (JWT, AWS region, Bedrock, ...). The backend validates every key at startup.
    env_file: ./backend/.env
    environment:
      # Overrides backend/.env: inside the compose network the DB is reached by service
      # name, and the credentials have one source of truth (root .env).
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: ${DB_USER:?DB_USER is required in .env}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required in .env}
      DB_NAME: ${DB_NAME:?DB_NAME is required in .env}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5
    mem_limit: 384m
    networks:
      - amiga

  frontend:
    build:
      context: ./frontend
      target: runner
      args:
        # `?` without `:` - must be defined, but an empty value (same-origin) is allowed.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL?NEXT_PUBLIC_API_URL must be defined in .env (empty = same-origin)}
    image: amiga-robot-admin-frontend
    container_name: amiga-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    mem_limit: 256m
    networks:
      - amiga

  caddy:
    image: caddy:2-alpine
    container_name: amiga-caddy
    restart: unless-stopped
    ports:
      - "${WEB_PORT:?WEB_PORT is required in .env}:80"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    mem_limit: 64m
    networks:
      - amiga

volumes:
  # Resolves to "amiga-robot-admin_postgres-data" (project name prefix).
  postgres-data:
  caddy-data:
  caddy-config:

networks:
  amiga:
