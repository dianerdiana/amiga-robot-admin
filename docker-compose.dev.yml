# Local development override (hot reload). Never use on EC2.
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
#
# App: http://localhost:${WEB_PORT}  (same Caddy routing as production)
# Direct API + /docs: http://127.0.0.1:8000   DB: 127.0.0.1:${DB_HOST_PORT}

services:
  db:
    ports:
      - "127.0.0.1:${DB_HOST_PORT:?DB_HOST_PORT is required in .env for the dev override}:5432"

  backend:
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - ./backend:/app
      # Keep the host virtualenv out of the container.
      - /app/.venv
    ports:
      - "127.0.0.1:8000:8000"
    mem_limit: 1g

  frontend:
    build:
      target: dev
    image: amiga-robot-admin-frontend-dev
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL?NEXT_PUBLIC_API_URL must be defined in .env (empty = same-origin)}
    volumes:
      - ./frontend:/app
      # Use the container's node_modules and build cache, not the host's.
      - /app/node_modules
      - /app/.next
    mem_limit: 2g
